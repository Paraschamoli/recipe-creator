id: recipe-creator-v1
name: recipe-creator
version: 1.0.0
author: paras25619@gmail.com

# Description
description: |
  Generates personalized recipes, meal plans, and step-by-step cooking instructions.
  Adapts to available ingredients, dietary preferences, cuisine types, cooking time, skill level, and health goals.
  Provides ingredient substitutions, nutritional guidance, and tips for efficient, creative cooking.

# Tags and Modes
tags:
  - recipe
  - cooking
  - meal-planning
  - dietary-restrictions
  - culinary
  - nutrition
  - ingredients
  - food
  - kitchen
  - chef

input_modes:
  - text/plain
  - application/json

output_modes:
  - text/plain
  - application/json
  - text/markdown

# Example Queries
examples:
  - "I have chicken, rice, and vegetables. What can I make in 30 minutes?"
  - "Create a vegetarian pasta recipe with mushrooms and spinach"
  - "Suggest healthy breakfast options with oats and fruits"
  - "Plan a weekly keto meal prep with shopping list"
  - "Give me a gluten-free dinner recipe using salmon and asparagus"

# Detailed Capabilities
capabilities_detail:
  recipe_generation:
    supported: true
    description: "Generates recipes tailored to ingredients, dietary restrictions, cuisine, cooking time, and skill level"
    features:
      - Ingredient-based recipe suggestions
      - Dietary restriction adaptation (vegetarian, vegan, gluten-free, keto, paleo, dairy-free, nut-free)
      - Cuisine-specific recipe creation
      - Skill-level adjustment (beginner, intermediate, advanced)
      - Time-constrained meal planning
      - Health goal optimization
    limitations: "Requires internet for recipe search; may not reflect real-time ingredient availability"

  meal_planning:
    supported: true
    description: "Generates multi-day or weekly meal plans and shopping lists"
    features:
      - Weekly or multi-day meal plan generation
      - Nutritional balance optimization
      - Grocery shopping list creation
      - Leftover utilization planning
      - Seasonal ingredient suggestions
      - Budget-conscious meal options
    limitations: "Nutritional calculations are estimates; individual dietary needs may vary"

  cooking_guidance:
    supported: true
    description: "Provides step-by-step cooking instructions, substitutions, and culinary advice"
    features:
      - Step-by-step instructions
      - Ingredient substitution suggestions
      - Cooking technique explanations
      - Common mistakes avoidance
      - Equipment recommendations
      - Plating and presentation tips
    limitations: "Cannot demonstrate physically; relies on textual instructions"

# Requirements
requirements:
  packages:
    - agno>=2.2.0
    - exa-py>=1.1.0
    - mem0ai>=1.0.1
    - openai>=2.11.0
  system:
    - Python 3.12+
    - Internet connection for recipe search
  min_memory_mb: 512
  external_services:
    - OpenRouter API for LLM access
    - Exa API for recipe and ingredient lookup
    - Mem0 AI for memory operations

# Performance Metrics
performance:
  avg_processing_time_ms: 3000
  max_concurrent_requests: 8
  memory_per_request_mb: 256
  timeout_seconds: 60
  max_recipes_per_query: 5
  scalability: horizontal

# Tool Restrictions
allowed_tools:
  - RecipeSearch
  - IngredientLookup
  - MealPlanning
  - NutritionAnalysis
  - CookingInstructions
  - DietaryAdjustment
  - ShoppingList

# Rich Documentation
documentation:
  overview: |
    Recipe Creator transforms ingredients, preferences, and dietary constraints into creative, personalized meals.
    It provides recipes, meal plans, cooking instructions, ingredient substitutions, and nutritional guidance,
    enabling users to cook efficiently, plan ahead, and achieve health goals while experimenting with cuisines.

  use_cases:
    when_to_use:
      - "Generate recipes from available ingredients"
      - "Plan meals for dietary restrictions or health goals"
      - "Quick and easy cooking solutions"
      - "Weekly meal prep assistance"
      - "Learning new cooking techniques"
      - "Grocery shopping guidance"
    when_not_to_use:
      - "Real-time cooking demonstration"
      - "Restaurant recommendations"
      - "Food delivery or ordering services"
      - "Medical or food safety consultation"
      - "Calorie tracking or diet logging"

  input_structure: |
    Accepts text or JSON inputs describing ingredients, preferences, and constraints.

    Example (Plain Text):
    "I have chicken, broccoli, and rice. Suggest a quick healthy dinner recipe."

    Example (JSON):
    {
      "ingredients": ["chicken", "rice", "broccoli", "garlic"],
      "dietary_preferences": ["vegetarian", "gluten-free"],
      "cuisine_type": "italian",
      "cooking_time_minutes": 45,
      "skill_level": "beginner",
      "servings": 4,
      "health_goals": ["high-protein", "low-carb"],
      "exclude_ingredients": ["onions", "mushrooms"]
    }

    Constraints:
      - Max ingredients: 15
      - Max cooking time: 240 minutes
      - Max servings: 20
      - Supported dietary preferences: vegetarian, vegan, gluten-free, keto, paleo, dairy-free, nut-free
      - Timeout: 60 seconds

  output_format: |
    Returns structured recipe, meal plan, and cooking guidance.

    Output Structure:
    - RECIPE:
      - title: string
      - description: string
      - cuisine: string
      - prep_time_minutes: integer
      - cook_time_minutes: integer
      - total_time_minutes: integer
      - difficulty: beginner/intermediate/advanced
      - servings: integer
      - dietary_tags: list
      - ingredients: list of {name, quantity, notes}
      - instructions: list of {step, description, time_minutes, tips}
      - nutrition_per_serving: {calories, protein_g, carbohydrates_g, fat_g, fiber_g}
      - tips_and_variations: list
      - pairing_suggestions: list
    - SHOPPING_LIST:
      - ingredients_to_buy: list of {name, quantity, category}
      - estimated_cost: float
    - METADATA:
      - processing_time_ms: integer
      - ingredients_used: list
      - ingredients_missing: list
      - confidence_score: float
      - source_attribution: string

    Error Response:
    - code: string
    - message: string
    - suggestions: list of string

  error_handling:
    - "No recipes found: Suggest alternative ingredients or relax constraints"
    - "Ingredient conflicts: Identify incompatible dietary restrictions"
    - "Timeout: Return best available results"
    - "Invalid input: Provide clear guidance and format examples"
    - "API limits: Queue requests or suggest simpler queries"
    - "Unclear preferences: Ask for clarification"

  examples:
    - title: "30-Minute Chicken Dinner"
      input:
        ingredients: ["chicken breast", "broccoli", "garlic", "rice"]
        cooking_time_minutes: 30
        servings: 2
      output:
        recipe:
          title: "Garlic Herb Chicken with Steamed Broccoli and Rice"
          prep_time_minutes: 10
          cook_time_minutes: 20
          difficulty: "beginner"
        metadata:
          processing_time_ms: 1800
          confidence_score: 0.95

    - title: "Vegetarian Pasta"
      input:
        ingredients: ["pasta", "mushrooms", "spinach", "tomatoes"]
        dietary_preferences: ["vegetarian"]
        cuisine_type: "italian"
      output:
        recipe:
          title: "Creamy Mushroom and Spinach Pasta"
          cuisine: "Italian"
          dietary_tags: ["vegetarian"]
        metadata:
          processing_time_ms: 2200
          confidence_score: 0.88

    - title: "Healthy Breakfast"
      input:
        ingredients: ["oats", "bananas", "almonds", "honey"]
        health_goals: ["high-fiber", "low-sugar"]
      output:
        recipe:
          title: "Banana Almond Overnight Oats"
          dietary_tags: ["vegetarian", "gluten-free"]
        metadata:
          processing_time_ms: 1500
          confidence_score: 0.90

  best_practices:
    for_developers:
      - "Cache frequent ingredient combinations"
      - "Validate dietary preference combinations"
      - "Offer ingredient substitutions"
      - "Include nutritional info when available"
      - "Provide multiple difficulty levels"
      - "Use progressive disclosure for complex recipes"

    for_orchestrators:
      - "Route recipe and cooking queries here"
      - "Chain with nutrition analysis for health-focused users"
      - "Combine with shopping list generators for meal planning"
      - "Consider user's time constraints"
      - "Use dietary preferences for personalized recommendations"
      - "Monitor seasonal ingredient availability"

  installation: |
    Required packages:
    pip install agno exa-py mem0ai openai

    Environment variables:
    - OPENROUTER_API_KEY
    - EXA_API_KEY
    - MEM0_API_KEY

    System requirements:
    - Python 3.12+
    - Internet connection

  versioning:
    - version: "1.0.0"
      date: "2026-01-13"
      changes: "Initial release with recipe generation, meal planning, and cooking guidance"
    - version: "1.1.0"
      status: "planned"
      changes: "Add image-based ingredient recognition and video cooking instructions"
    - version: "1.2.0"
      status: "planned"
      changes: "Integration with grocery delivery APIs and smart kitchen devices"

# Assessment fields for skill negotiation
assessment:
  keywords:
    - recipe
    - cook
    - meal
    - food
    - ingredients
    - breakfast
    - lunch
    - dinner
    - vegetarian
    - vegan
    - gluten-free
    - keto
    - healthy
    - quick
    - easy
    - chef
    - kitchen
    - cooking
    - bake
    - baking

  specializations:
    - domain: home_cooking
      confidence_boost: 0.4
    - domain: meal_planning
      confidence_boost: 0.3
    - domain: dietary_restrictions
      confidence_boost: 0.3

  anti_patterns:
    - restaurant review
    - food delivery
    - nutrition tracker
    - exercise plan
    - weight loss
    - medical advice
    - food safety
    - restaurant booking

  complexity_indicators:
    simple:
      - "recipe for"
      - "how to cook"
      - "meal idea"
      - "ingredients"
      - "quick dinner"
    medium:
      - "meal plan"
      - "weekly recipes"
      - "dietary restrictions"
      - "cooking instructions"
      - "shopping list"
    complex:
      - "nutritional analysis"
      - "multi-course menu"
      - "special diet planning"
      - "ingredient substitutions"
      - "advanced techniques"
      - "meal prep for week"
